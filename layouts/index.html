<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wongjai</title>
  <meta name="description" content="Wongjai：Woji 記帳 App、AI 財報分析、多語新聞。">
  <!-- 首頁入口（使用者 2026-11-27：wongjai.com 首頁放三個網站的連結；原本的財報首頁內容在 /earnings/） -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-4KFCWP0FMS"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-4KFCWP0FMS');
  </script>
  <style>
    :root { --bg:#0b1120; --card:#151e33; --card-hover:#1a2640; --line:#1c2a44; --fg:#e8edf5; --muted:#9aa8c0; --green:#00e6b0; --blue:#4d9fff; --purple:#a78bfa; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:var(--bg); color:var(--fg); font:16px/1.6 Inter, -apple-system, "PingFang TC", "Noto Sans TC", sans-serif; display:flex; flex-direction:column; }
    main { flex:1; max-width:960px; width:100%; margin:0 auto; padding:72px 22px 40px; }
    h1 { font-size:44px; font-weight:800; letter-spacing:-.5px; margin:0 0 8px; }
    .lead { color:var(--muted); font-size:18px; margin:0 0 44px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:18px; }
    a.card { display:flex; flex-direction:column; gap:10px; padding:26px 24px; background:var(--card); border:1px solid var(--line); border-radius:18px; color:inherit; text-decoration:none; transition:background .15s, transform .15s, border-color .15s; }
    a.card:hover { background:var(--card-hover); transform:translateY(-2px); }
    a.card:focus-visible { outline:2px solid var(--green); outline-offset:3px; }
    .icon { width:56px; height:56px; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:28px; }
    .icon img { width:56px; height:56px; border-radius:13px; }
    .card h2 { margin:6px 0 0; font-size:21px; }
    .card p { margin:0; color:var(--muted); font-size:15px; flex:1; }
    .url { font-size:13px; font-family:ui-monospace, "JetBrains Mono", monospace; }
    .woji:hover { border-color:var(--purple); } .woji .url { color:var(--purple); }
    .earn .icon { background:rgba(0,230,176,.1); } .earn:hover { border-color:var(--green); } .earn .url { color:var(--green); }
    .news .icon { background:rgba(77,159,255,.1); } .news:hover { border-color:var(--blue); } .news .url { color:var(--blue); }
    footer { color:#5e6f8a; font-size:13px; text-align:center; padding:28px 0 36px; }
    @media (max-width:520px) { main { padding-top:48px; } h1 { font-size:34px; } }
  </style>
</head>
<body>
  <main>
    <h1>Wongjai</h1>
    <p class="lead">記帳、財報、新聞，都在這裡。</p>
    <div class="grid">
      <a class="card woji" href="https://woji.wongjai.com/">
        <div class="icon"><img src="/img/woji-icon.png" alt=""></div>
        <h2>Woji 記帳</h2>
        <p>帳只存在你的 iPhone 上的記帳 App：不用註冊、沒有廣告、不追蹤。</p>
        <span class="url">woji.wongjai.com →</span>
      </a>
      <a class="card earn" href="/earnings/">
        <div class="icon" aria-hidden="true">📊</div>
        <h2>AI 財報分析</h2>
        <p>機構級財報分析與法說會深度解讀。</p>
        <span class="url">wongjai.com/earnings →</span>
      </a>
      <a class="card news" href="https://news.wongjai.com/">
        <div class="icon" aria-hidden="true">📰</div>
        <h2>多語新聞</h2>
        <p>科技與財經新聞，中、英、日、韓多語摘要。</p>
        <span class="url">news.wongjai.com →</span>
      </a>
    </div>
  </main>
  <footer>© {{ now.Year }} Wongjai</footer>
</body>
</html>
