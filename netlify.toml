[build]
  command = "hugo --gc --minify"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.159.1"
  HUGO_ENV = "production"
  TZ = "Asia/Taipei"

[[redirects]]
  from = "/api/*"
  to = "/api/:splat"
  status = 200

# 公司頁別名（2026-11-28 改版）：常見的另一個代號轉到正式的公司頁
[[redirects]]
  from = "/companies/tsm"
  to = "/companies/2330/"
  status = 301
[[redirects]]
  from = "/companies/tsmc"
  to = "/companies/2330/"
  status = 301
[[redirects]]
  from = "/companies/googl"
  to = "/companies/goog/"
  status = 301
[[redirects]]
  from = "/:lang/companies/tsm"
  to = "/:lang/companies/2330/"
  status = 301
[[redirects]]
  from = "/:lang/companies/tsmc"
  to = "/:lang/companies/2330/"
  status = 301
[[redirects]]
  from = "/:lang/companies/googl"
  to = "/:lang/companies/goog/"
  status = 301

# 文章改名（2026-11-28）：舊網址 301 到新網址。force＝true 讓 301 蓋過 Hugo aliases 產生的轉址頁。
[[redirects]]
  from = "/earnings/intel-q1-fy2026/"
  to = "/earnings/intel-2026q1/"
  status = 301
  force = true
[[redirects]]
  from = "/earnings/googl-q4-2025/"
  to = "/earnings/goog-q4-2025/"
  status = 301
  force = true
[[redirects]]
  from = "/earnings/googl-q1-2026/"
  to = "/earnings/goog-q1-2026/"
  status = 301
  force = true
[[redirects]]
  from = "/earnings/googl-q3-2026/"
  to = "/earnings/goog-q3-2026/"
  status = 301
  force = true
[[redirects]]
  from = "/:lang/earnings/googl-q3-2026/"
  to = "/:lang/earnings/goog-q3-2026/"
  status = 301
  force = true

[context.production.environment]
  HUGO_ENV = "production"

[context.deploy-preview]
  command = "hugo --gc --minify -b $DEPLOY_PRIME_URL"

[context.branch-deploy]
  command = "hugo --gc --minify -b $DEPLOY_PRIME_URL"
