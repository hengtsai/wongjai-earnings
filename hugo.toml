baseURL = "https://earnings.wongjai.com/"
title = "Wongjai AI Earning Calls"
theme = "wongjai-theme"
timeZone = "Asia/Taipei"

# 多語（2026-11-27，Buffet 轉使用者要求）：繁中是預設語言、網址不加前綴（/earnings/<slug>/ 不變）；
# 其他語言 /zh-cn/、/en/、/ja/、/ko/。同一篇的各語言放同一資料夾、用檔名後綴：panw-q1-fy2027.md（繁中）、
# panw-q1-fy2027.en.md…（Munger 負責，必須是 LLM 翻譯，不可用機器翻譯）。介面文字在 i18n/*.toml。
defaultContentLanguage = "zh-tw"
defaultContentLanguageInSubdir = false

[languages]
  [languages.zh-tw]
    languageCode = "zh-TW"
    languageName = "繁體中文"
    weight = 1
    title = "Wongjai AI Earning Calls"
  [languages.zh-cn]
    languageCode = "zh-CN"
    languageName = "简体中文"
    weight = 2
    title = "Wongjai AI Earning Calls"
  [languages.en]
    languageCode = "en"
    languageName = "English"
    weight = 3
    title = "Wongjai AI Earning Calls"
  [languages.ja]
    languageCode = "ja"
    languageName = "日本語"
    weight = 4
    title = "Wongjai AI Earning Calls"
  [languages.ko]
    languageCode = "ko"
    languageName = "한국어"
    weight = 5
    title = "Wongjai AI Earning Calls"

[params]
  description = "AI 驅動的機構級財報分析與法說會摘要存檔"
  author = "Wongjai AI Team"
  keywords = ["財報分析", "法說會", "earning calls", "TSMC", "AI", "quantitative analysis"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = "dracula"
    lineNos = true

[build]
  writeStats = true
  buildDrafts = false
